services:
  - type: web
    name: monthsary
    env: static
    buildCommand: echo "No build needed"
    startCommand: echo "Static site - no start command needed"
    staticPublishPath: .
    headers:
      - source: /
        headers:
          - key: Cache-Control
            value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
